# 这是自定义扩展规则的唯一入口；sync 不会覆盖此文件。
# @proxy 自动适配普通版的“🚀 手动选择”和 Fallback 版的“🚀 故障转移”。
# @direct = DIRECT；@reject = REJECT。请把示例域名换成自己的域名再启用。

# 明确的误杀白名单/强制例外：优先于秋风过滤。
before_filter:
  # 具体服务域名精确匹配；站点根域同时覆盖其子域名。
  - DOMAIN,qlxft.ourduda.com,@direct
  - DOMAIN-SUFFIX,neolive.kr,@direct
  - DOMAIN-SUFFIX,pandalive.co.kr,@direct
  - DOMAIN,time.windows.com,@direct
  - DOMAIN,codexapp.agentsmirror.com,@direct
  - DOMAIN,www.wellcee.com,@direct

# 一般个人分流：先应用所选过滤方案，再应用自定义扩展规则，最后进入 Aethersailor。
after_filter: []
# after_filter:
#   - DOMAIN-SUFFIX,proxy.example.com,@proxy
#   - DOMAIN,block.example.com,@reject
#   - IP-CIDR,192.0.2.10/32,@direct,no-resolve

# 可选：yaml、ini（共享 Clash）或 stash（附加 Stash）独有的规则。
formats: {}
# formats:
#   yaml:
#     after_filter:
#       - "AND,((DOMAIN,example.com),(NETWORK,TCP)),@proxy"
#   stash:
#     after_filter:
#       - "DOMAIN,stash-only.example.com,@proxy"

# 可选：仅给某个模板追加规则，避免在 Lite 引用标准版独有的策略组。
variants: {}
# variants:
#   standard:
#     after_filter:
#       - DOMAIN,ai.example.com,🤖 ChatGPT
#     formats:
#       yaml:
#         after_filter:
#           - "AND,((DOMAIN,example.com),(NETWORK,TCP)),@proxy"
