name: Check rule templates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # 允许只提交个人规则等源文件；默认分支的更新流程负责提交新产物。
      - name: Build templates from the committed upstream snapshot
        run: python scripts/rules.py build

      - name: Validate public YAML with the pinned Mihomo core
        run: python scripts/check_mihomo.py --download --config-dir dist

      - name: Check generated templates without fetching upstream
        run: python scripts/rules.py check
