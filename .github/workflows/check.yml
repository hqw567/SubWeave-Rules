name: Check rule templates

on:
  push:
    paths:
      - "config/**"
      - "rules/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "vendor/**"
      - "dist/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "config/**"
      - "rules/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "vendor/**"
      - "dist/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 默认分支 push 由 update-upstream.yml 验证，避免重复跑完整门禁。
    if: >-
      github.event_name != 'push' ||
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate branch or pull-request templates
        uses: ./.github/actions/validate-templates
