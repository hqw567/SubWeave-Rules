name: Update upstream templates

on:
  schedule:
    # 22:15 UTC = 次日 06:15 Asia/Shanghai；GitHub 调度可能延迟。
    - cron: "15 22 * * *"
  push:
    paths:
      - "config/**"
      - "rules/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "vendor/**"
      - "dist/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional one-run override: main or full SHA; blank uses config/upstream.yaml"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: update-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    # 源文件变更只在默认分支自动提交；分支和 PR 由只读检查流程验证。
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      UPSTREAM_REF: ${{ inputs.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild source changes from the current upstream snapshot
        if: github.event_name == 'push'
        run: python scripts/rules.py build

      - name: Sync configured upstream revision and rebuild public templates
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$UPSTREAM_REF" ]]; then
            python scripts/rules.py sync --ref "$UPSTREAM_REF"
          else
            python scripts/rules.py sync
          fi

      - name: Detect changes before publication checks
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet HEAD -- vendor/ dist/ || [[ -n "$(git ls-files --others --exclude-standard -- vendor/ dist/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 源代码 push 即使未改变产物，也要检查代码；定时/手动无产物变化则跳过重验证。
      - name: Validate changed templates and source updates
        if: github.event_name == 'push' || steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/validate-templates
        with:
          build: "false"

      - name: Report unchanged scheduled or manual update
        if: github.event_name != 'push' && steps.changes.outputs.changed != 'true'
        run: echo "No snapshot or template changes; publication checks and commit are unnecessary."

      - name: Commit changed snapshots and public templates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -- vendor/ dist/
          if git diff --cached --quiet; then
            echo "Upstream snapshots and public templates are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rules): update generated templates"
          git push origin "HEAD:${DEFAULT_BRANCH}"
