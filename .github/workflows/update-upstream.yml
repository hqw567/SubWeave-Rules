name: Update upstream templates

on:
  schedule:
    # 22:15 UTC = 次日 06:15 Asia/Shanghai；GitHub 调度可能延迟。
    - cron: "15 22 * * *"
  push:
    paths:
      - "config/**"
      - "rules/**"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      ref:
        description: "Aethersailor upstream ref: main or a full 40-character commit SHA"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: update-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    # 源文件变更只在默认分支自动提交；分支和 PR 由只读检查流程验证。
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      UPSTREAM_REF: ${{ inputs.ref || 'main' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync approved upstream files and rebuild public templates
        run: python scripts/rules.py sync --ref "$UPSTREAM_REF"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check generated templates
        run: python scripts/rules.py check

      - name: Commit changed snapshots and public templates
        shell: bash
        run: |
          set -euo pipefail
          git add -- vendor/ dist/
          if git diff --cached --quiet; then
            echo "Upstream snapshots and public templates are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rules): sync upstream templates"
          git push origin "HEAD:${DEFAULT_BRANCH}"
