# Edit rules/custom.yaml and rebuild; do not edit generated routing.
# PUBLIC TEMPLATE: fill provider URLs locally, or use the render command.
# Filter profile: ads-privacy
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: true
tcp-concurrent: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
tun:
  enable: false
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  - localhost.ptlogin2.qq.com
  respect-rules: false
  default-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  nameserver-policy:
    geosite:cn:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
  nameserver:
  - https://1.1.1.1/dns-query#🚀 手动选择
  - https://8.8.8.8/dns-query#🚀 手动选择
proxy-providers:
  provider1:
    type: http
    url: https://example.com/REPLACE_WITH_YOUR_SUBSCRIPTION_URL
    interval: 3600
    path: ./proxy_provider/provider1.yaml
    proxy: DIRECT
    filter: ^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      udp: true
proxy-groups:
- name: 🚀 手动选择
  type: select
  url: https://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - ♻️ 自动选择
  use:
  - provider1
- name: ♻️ 自动选择
  type: url-test
  use:
  - provider1
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🎯 全球直连
  type: select
  url: https://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - DIRECT
- name: 🛡️ 秋风过滤
  type: select
  proxies:
  - REJECT
  - 🚀 手动选择
rule-providers:
  awavenue-ads-privacy:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical-No.Unwelcome.yaml
    path: ./rule_provider/awavenue-ads-privacy.yaml
    interval: 86400
rules:
- DOMAIN,qlxft.ourduda.com,DIRECT
- DOMAIN-SUFFIX,neolive.kr,DIRECT
- DOMAIN-SUFFIX,pandalive.co.kr,DIRECT
- DOMAIN,time.windows.com,DIRECT
- DOMAIN,codexapp.agentsmirror.com,DIRECT
- DOMAIN,www.wellcee.com,DIRECT
- RULE-SET,awavenue-ads-privacy,🛡️ 秋风过滤
- GEOSITE,gfw,🚀 手动选择
- GEOIP,telegram,🚀 手动选择,no-resolve
- GEOIP,facebook,🚀 手动选择,no-resolve
- GEOIP,twitter,🚀 手动选择,no-resolve
- MATCH,🎯 全球直连
